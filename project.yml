# Inbox XcodeGen spec.
#
# This file is the only authoritative Xcode project description.
# Inbox.xcodeproj is generated (`xcodegen generate`) and checked in so a
# clone can be opened in Xcode without running XcodeGen first. After
# changing this file, regenerate and commit both.
name: Inbox
packages:
  # The single third-party dependency (SPEC 铁律的唯一例外，HISTORY 决策 16):
  # auto-update install security (EdDSA, atomic swap, translocation) is not
  # something to hand-roll. Xcode builds only — Package.swift stays without
  # it, so `swift build`/`swift test`/smoke keep the zero-dependency loop.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"
options:
  minimumXcodeGenVersion: "2.46"
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Automatic signing with the user's team (configured 2026-08-21 in
    # Xcode, mirrored here so `xcodegen generate` preserves it). Needed for
    # the S6 CloudKit entitlements.
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: YWQ4TY4VR5
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  Inbox:
    type: application
    platform: macOS
    sources:
      - path: Sources/Inbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaolin.Inbox
        PRODUCT_NAME: Inbox
        MARKETING_VERSION: "0.3.1"
        # CFBundleVersion mirrors the marketing version — Sparkle compares
        # sparkle:version against it, so it must move on every release.
        CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        COMBINE_HIDPI_IMAGES: YES
        # App icon lives in Sources/Inbox/Resources/Assets.xcassets (10 PNGs
        # from the user's iconset); Xcode writes CFBundleIconName itself.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Debug:
          # CloudKit container environment and APS environment are read by
          # the entitlements file per configuration: Debug talks to the
          # Development container, Release to Production (schema must be
          # deployed there first — docs/RELEASE.md).
          ICLOUD_CONTAINER_ENVIRONMENT: Development
          APS_ENVIRONMENT: development
        Release:
          ICLOUD_CONTAINER_ENVIRONMENT: Production
          APS_ENVIRONMENT: production
          # Mirrors the entitlement for code (InboxSyncEngine.environment).
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: CLOUDKIT_PRODUCTION
          # Distribution shape (Developer ID + notarization need it); the app
          # uses no entitlement exceptions, so Debug stays off for speed.
          ENABLE_HARDENED_RUNTIME: YES
          # Apple Silicon only: the x86_64 slice doubled the bundle (1.2 MB
          # per arch) for machines this app is never run on.
          ARCHS: arm64
          # Size over speed: the hot paths are AppKit/SQLite, not our code;
          # -Osize measured 639 KB vs 754 KB stripped with no visible cost.
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
    # S6: CloudKit record-level sync (CKSyncEngine). aps-environment enables
    # the push notifications CKSyncEngine uses for remote change hints.
    info:
      path: Sources/Inbox/Resources/Info.plist
      properties:
        # Sparkle feed follows the latest GitHub release (docs/RELEASE.md).
        # The public EdDSA key pairs with the CI secret SPARKLE_ED_PRIVATE_KEY
        # (private key also in the account holder's login Keychain).
        SUFeedURL: https://github.com/lixiaolin94/Inbox/releases/latest/download/appcast.xml
        SUPublicEDKey: "eaPIgZ2aNcGGEWHZVbVc1rmaP1jKoX4inFv+5k79TpA="
        # Personal tool: check for updates on schedule without asking first
        # (skips Sparkle's second-launch consent prompt).
        SUEnableAutomaticChecks: true
    entitlements:
      path: Inbox.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.xiaolin.Inbox]
        com.apple.developer.icloud-container-environment: $(ICLOUD_CONTAINER_ENVIRONMENT)
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: CloudKit.framework
      - package: Sparkle
    scheme:
      testTargets:
        - InboxTests
  InboxTests:
    type: bundle.unit-test
    platform: macOS
    # Logic tests compile store/model sources directly so `xcodebuild test`
    # does not need a TEST_HOST and does not load the AppKit UI. SPM keeps
    # `@testable import Inbox` via SWIFT_PACKAGE.
    sources:
      - path: Tests/InboxTests
      - path: Sources/Inbox
        includes:
          - App/LaunchConfiguration.swift
          - App/Preferences.swift
          - App/SummonPlacement.swift
          - Model/Record.swift
          - Model/Project.swift
          - Model/Scope.swift
          - Model/RecordSort.swift
          - Model/ListRow.swift
          - Model/RowFocus.swift
          - Model/Export.swift
          - Storage/SQLiteDatabase.swift
          - Storage/RecordStore.swift
          - Storage/RecordStore+Sync.swift
          - Storage/ProjectStore.swift
          - Sync/SyncTypes.swift
          - Sync/ConflictMerger.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaolin.InboxTests
        PRODUCT_NAME: InboxTests
        LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: YES
        # Empty host: these are logic tests, not app-hosted.
        BUNDLE_LOADER: ""
        TEST_HOST: ""
    dependencies:
      - sdk: libsqlite3.tbd

# Automated release (docs/RELEASE.md): push a tag `v<version>` that matches
# project.yml's MARKETING_VERSION and this job archives, signs (Developer ID
# via Xcode cloud signing), notarizes, staples, signs the Sparkle feed and
# publishes a GitHub release carrying Inbox-<version>.zip + appcast.xml.
#
# Required repository secrets:
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8  — App Store Connect API key
#     (Admin role; .p8 content verbatim). Feeds cloud signing + notarytool.
#   SPARKLE_ED_PRIVATE_KEY — EdDSA private key from `generate_keys -x`.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches project version
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -1)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != project.yml version $VERSION"; exit 1; }

      - name: Select newest Xcode 26 (macOS 26 SDK required)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Build, notarize, staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          scripts/release.sh

      - name: Sparkle signature + appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/make_appcast.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/Inbox-*.zip build/appcast.xml \
            --title "Inbox $GITHUB_REF_NAME" --generate-notes
